[tool.poetry]
name = "rnable-2"
version = "0.1.0"
description = "Django project supporting informatics analyses"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "rnable_2"}]

[tool.poetry.dependencies]
python = "^3.10"
Django = "^5.2.6"
psycopg2-binary = "^2.9.0"
python-decouple = "^3.8"
python-dotenv = "^1.0.0"
# Data analysis and scientific computing
pandas = "^2.0.0"
numpy = "^1.24.0"
scikit-learn = "^1.3.0"
# R integration
rpy2 = "^3.5.0"
# Plotting
matplotlib = "^3.7.0"
plotly = "^5.17.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
pytest-django = "^4.11.1"
pytest-cov = "^7.0.0"
black = "^25.11.0"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "rnable_2.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
